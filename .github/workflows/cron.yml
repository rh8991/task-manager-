# Calls the app every hour so the weekly report goes out at the exact hour the manager picked,
# and due-date reminders go out each morning. The endpoint is idempotent, so extra calls are harmless.
# Setup: in GitHub → Settings → Secrets and variables → Actions, add APP_URL and CRON_SECRET.
name: scheduler

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set yet - skipping."
            exit 0
          fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
